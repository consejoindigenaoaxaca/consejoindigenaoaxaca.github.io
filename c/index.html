<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credencial · Consejo Indígena</title><link rel="icon" href="../logo.png"><style>:root{--azul:#1F3A5F;--amar:#F5D21E;--cielo:#3FA9DD;--texto:#1d1d1f;--gris:#5a5a5a;--fondo:#ffffff;--linea:#d6dde7;--fila:#f2f5f9}
@media (prefers-color-scheme:dark){:root{--texto:#e8e8ea;--gris:#a9adb5;--fondo:#14171c;--linea:#2c333d;--fila:#1b2027}}
*{box-sizing:border-box}body{margin:0;background:var(--fondo);color:var(--texto);font:16px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{background:var(--azul);color:#fff;border-bottom:4px solid var(--amar)}
.barra{max-width:820px;margin:0 auto;padding:14px 16px;display:flex;gap:14px;align-items:center}
.barra img{width:56px;height:56px;border-radius:50%;background:#fff}
.barra b{font-size:14px;letter-spacing:.2px;line-height:1.3}
main{max-width:820px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:8px 0 2px;color:var(--azul)}@media (prefers-color-scheme:dark){h1,h2{color:#8fc3ea!important}}
.sub{color:var(--gris);margin:0 0 18px}h2{font-size:18px;color:var(--azul);margin:26px 0 8px}
table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:15px}th{background:var(--azul);color:#fff;text-align:left;padding:8px}
td{border:1px solid var(--linea);padding:8px;vertical-align:top}tr:nth-child(even) td{background:var(--fila)}
main p,main li,td:last-child{text-align:justify;hyphens:auto;-webkit-hyphens:auto}.sub,.fecha{text-align:left}
.fecha{margin-top:28px;color:var(--gris);font-size:14px}a{color:var(--cielo)}
footer{border-top:1px solid var(--linea);color:var(--gris);font-size:13px;text-align:center;padding:16px}
.tarjetas{display:grid;gap:12px;margin-top:16px}.tarjetas a{display:block;padding:16px;border:1px solid var(--linea);border-radius:10px;text-decoration:none;color:var(--texto)}
.tarjetas a b{color:var(--cielo)}@media(max-width:560px){table,thead,tbody,tr,td,th{font-size:14px}}</style>
<script>
/* Servidor vigente. Si el sistema cambia de servidor, solo se edita esta línea. */
var DESTINO = "";   /* ejemplo: "https://consejoindigena.tailaaa839.ts.net/credencial/" */
var k = new URLSearchParams(location.search).get("k") || "";
if (DESTINO && /^[A-Z0-9]{16,32}$/.test(k)) { location.replace(DESTINO + encodeURIComponent(k)); }
</script></head><body>
<header><div class="barra"><img src="../logo.png" alt="Logo"><b>OAXACA, PUEBLOS ORIGINARIOS INDÍGENAS DEL CONSEJO NACIONAL, A.C.</b></div></header>
<main><h1>Credencial de la Asociación</h1><p>Este servicio se está habilitando. Para cualquier duda, comuníquese al <b>951 267 5292</b> o escriba a consejoindigena.oaxaca@gmail.com.</p></main>
<footer>consejoindigena.oaxaca@gmail.com · 951 267 5292</footer></body></html>
